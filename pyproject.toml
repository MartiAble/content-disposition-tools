[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-disposition-tools"
version = "0.1.0"
description = "Small Python helpers for parsing and building HTTP Content-Disposition headers."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "MartiAble"}
]
keywords = ["http", "headers", "content-disposition", "rfc5987", "downloads"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/MartiAble/content-disposition-tools"
Repository = "https://github.com/MartiAble/content-disposition-tools"
Issues = "https://github.com/MartiAble/content-disposition-tools/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
